<style>
:root{
  --bg:#fff; --fill:#f5f5f7; --fill-2:#e8e8ed;
  /* ink-3 is Apple's #86868b on dark only; on white it measures 3.6:1, under
     the 4.5:1 small text needs, so light mode uses the ink-2 grey for it. */
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#6e6e73;
  --line:rgba(0,0,0,.08); --edge:rgba(0,0,0,.06);
  --link:#0066cc; --bar:rgba(255,255,255,.8);
  --on-ink:#fff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --wrap:1400px; --gut:32px; --gap:20px;
  --z-sticky:10; --z-modal:30; --z-toast:40;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --fill:#161617; --fill-2:#232325;
    --ink:#f5f5f7; --ink-2:#a1a1a6; --ink-3:#86868b;
    --line:rgba(255,255,255,.12); --edge:rgba(255,255,255,.08);
    --link:#2997ff; --bar:rgba(0,0,0,.72); --on-ink:#000;
  }
}
@media (max-width:900px){ :root{ --gut:24px; --gap:16px } }
@media (max-width:560px){ :root{ --gut:16px; --gap:10px } }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:17px; line-height:1.47; -webkit-font-smoothing:antialiased; letter-spacing:-.01em}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--link); outline-offset:3px; border-radius:8px}
.wrap{max-width:var(--wrap); margin:0 auto; padding:0 var(--gut)}

/* ─── top ─── */
.top{display:flex; align-items:center; height:52px}
.mark{display:flex; align-items:center; gap:8px; font-weight:600; font-size:17px; letter-spacing:-.02em}
.mark svg{display:block}
.top .sp{flex:1}
.top a.out{font-size:14px; color:var(--ink-2); display:inline-flex; align-items:center; min-height:44px; transition:color .2s}
.top a.out:hover{color:var(--ink)}

/* ─── hero ─── */
.hero{padding-top:44px; padding-bottom:36px; text-align:center}
h1{margin:0 auto; font-family:var(--display); font-weight:600; font-size:clamp(34px,4.6vw,58px); line-height:1.08; letter-spacing:-.025em; text-wrap:balance; max-width:14em}
.lede{margin:18px auto 0; max-width:40em; color:var(--ink-2); font-size:clamp(17px,1.6vw,21px); line-height:1.5; text-wrap:pretty}
@media (max-width:560px){ .hero{padding-top:28px; padding-bottom:24px} .lede{margin-top:12px} .lede br{display:none} }

/* ─── sticky bar: categories + search ───
   One row on a wide screen; on a phone the search takes its own row above
   the categories, which scroll sideways. */
.bar{position:sticky; top:0; z-index:var(--z-sticky); background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px)}
.bar.stuck{box-shadow:0 1px 0 var(--line)}
.bar-in{display:flex; align-items:center; gap:16px; height:60px}
.cats{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0; height:34px; padding:0 14px; border:0; border-radius:999px; background:transparent; color:var(--ink-2); font-size:14px; cursor:pointer; white-space:nowrap; transition:color .2s,background .2s}
.cat:hover{color:var(--ink)}
.cat[aria-pressed="true"]{background:var(--ink); color:var(--on-ink)}
.find{display:flex; align-items:center; gap:8px; flex:0 0 260px; height:36px; padding:0 12px; border-radius:10px; background:var(--fill); color:var(--ink-3); transition:background .2s}
.find:focus-within{background:var(--fill-2)}
.find input{flex:1; min-width:0; height:100%; border:0; background:transparent; color:var(--ink); font:inherit; font-size:15px; outline:none}
.find input::placeholder{color:var(--ink-3)}
.find input::-webkit-search-cancel-button{-webkit-appearance:none}
@media (max-width:720px){
  .bar-in{flex-wrap:wrap; height:auto; padding-top:10px; padding-bottom:8px; gap:8px}
  .find{flex:1 1 100%; order:-1}
  /* Full-bleed so the row scrolls from edge to edge, sized to exactly the
     viewport so it adds nothing to the page width. */
  .cats{flex:none; width:calc(100% + 2 * var(--gut)); margin:0 calc(-1 * var(--gut)); padding:0 var(--gut)}
}

/* ─── wall ───
   Columns are laid out by app.js (shortest column first, in reading order),
   because CSS columns would read top-to-bottom and bury the first screen. */
.status{min-height:20px; padding:18px 0 0; font-size:13px; color:var(--ink-3)}
.wall{display:flex; gap:var(--gap); align-items:flex-start; padding:10px 0 96px}
.col{flex:1; min-width:0; display:flex; flex-direction:column; gap:28px}
@media (max-width:560px){ .col{gap:20px} }

.card{display:block; animation:rise .7s var(--ease) both; animation-delay:calc(var(--i,0) * 40ms)}
@keyframes rise{from{opacity:0; transform:translateY(14px)}}
.media{position:relative; display:block; overflow:hidden; border-radius:14px; background:var(--fill); cursor:pointer}
@media (max-width:560px){ .media{border-radius:10px} }
/* A hairline inside the edge so a white screenshot does not dissolve into a
   white page. Inset, so it adds nothing to the box. */
.media::after{content:''; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 1px var(--edge); pointer-events:none}
.media img,.media video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s var(--ease), opacity .4s}
.media img{opacity:0}
.media img.in{opacity:1}
@media (hover:hover){ .card:hover .media img,.card:hover .media video{transform:scale(1.025)} }
.media video{opacity:0}
.media video.on{opacity:1}
.badge{position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,.5); color:#fff; display:grid; place-items:center; z-index:1}
@media (max-width:560px){ .badge{top:7px; right:7px; width:22px; height:22px} .badge svg{width:9px; height:9px} }

/* GitHub repos screenshot as the same grey page every time, so they are set
   in type instead. */
.repo{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:22px; gap:2px}
.repo .gh{position:absolute; top:20px; left:22px; color:var(--ink-3)}
.repo .o{font-size:14px; color:var(--ink-2)}
.repo .r{font-family:var(--display); font-size:clamp(20px,2vw,26px); font-weight:600; letter-spacing:-.02em; line-height:1.15; word-break:break-all}
.repo .s{position:absolute; top:20px; right:22px; font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}
@media (max-width:560px){ .repo{padding:12px} .repo .gh{top:11px; left:12px} .repo .s{top:11px; right:12px; font-size:11px} .repo .o{font-size:11px} .repo .r{font-size:16px} }

.cap{padding:12px 2px 0}
.cap .t{margin:0; font-size:15px; line-height:1.45; font-weight:500; letter-spacing:-.005em; text-wrap:pretty; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.cap .m{margin:4px 0 0; font-size:13px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
@media (max-width:560px){ .cap{padding-top:8px} .cap .t{font-size:13.5px} .cap .m{font-size:11.5px} }

.empty{padding:80px 0 120px; text-align:center; color:var(--ink-2); font-size:15px}
.gap{margin-top:18px; height:36px; padding:0 18px; border-radius:999px; border:0; background:var(--fill); color:var(--ink); font-size:14px; cursor:pointer; transition:background .2s}
.gap:hover{background:var(--fill-2)}

/* ─── player ─── */
dialog.player{position:fixed; inset:0; z-index:var(--z-modal); width:100vw; height:100dvh; max-width:none; max-height:none; margin:0; padding:0; border:0; background:transparent; color:#f5f5f7}
dialog.player::backdrop{background:rgba(0,0,0,.95)}
dialog.player[open]{display:flex; flex-direction:column; align-items:center; justify-content:center; animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}}
.player video{display:block; max-width:min(1200px,92vw); max-height:calc(100dvh - 200px); border-radius:12px; background:#000}
.player .pcap{width:min(720px,92vw); margin-top:18px; text-align:center}
.player .pt{margin:0; font-size:17px; line-height:1.5; font-weight:500}
.player .pm{margin:6px 0 0; font-size:14px; color:#a1a1a6}
.player .pm a{color:#2997ff}
.player .pm a:hover{text-decoration:underline}
.close{position:absolute; top:max(16px,env(safe-area-inset-top)); right:16px; width:44px; height:44px; border:0; border-radius:50%; background:rgba(255,255,255,.12); color:#f5f5f7; display:grid; place-items:center; cursor:pointer; transition:background .2s}
.close:hover{background:rgba(255,255,255,.22)}

/* ─── agent ─── */
.agent{padding:120px 0 128px; text-align:center; border-top:1px solid var(--line)}
.agent h2{margin:0; text-wrap:balance; font-family:var(--display); font-size:clamp(28px,3.4vw,40px); font-weight:600; letter-spacing:-.02em; line-height:1.12}
.agent p{margin:16px auto 0; max-width:32em; color:var(--ink-2); font-size:17px; text-wrap:pretty}
.cmd{display:inline-flex; align-items:center; gap:12px; max-width:100%; margin-top:28px; height:48px; padding:0 8px 0 20px; border:0; border-radius:12px; background:var(--fill); font-family:var(--mono); font-size:14px; cursor:pointer; transition:background .2s}
.cmd:hover{background:var(--fill-2)}
.cmd code{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cmd .c{flex-shrink:0; display:grid; place-items:center; width:34px; height:34px; border-radius:8px; color:var(--ink-2)}
.links{margin-top:28px; display:flex; justify-content:center; gap:28px; font-size:15px}
.links a{color:var(--link)}
.links a:hover{text-decoration:underline}
@media (max-width:560px){
  .agent{padding:80px 0 88px}
  /* Too long for a phone's width; wrapped in full beats an ellipsis over the
     part that matters. */
  .cmd{height:auto; padding:12px 8px 12px 14px; font-size:12.5px; text-align:left}
  .cmd code{white-space:normal; word-break:break-all}
}

footer{padding:20px 0 40px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-3)}
footer .wrap{display:flex; flex-wrap:wrap; gap:6px 20px}

.toast{position:fixed; left:50%; bottom:32px; z-index:var(--z-toast); transform:translate(-50%,12px); opacity:0; pointer-events:none; padding:10px 18px; border-radius:999px; background:var(--ink); color:var(--on-ink); font-size:14px; transition:opacity .25s var(--ease),transform .25s var(--ease)}
.toast.on{opacity:1; transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}
</style>
</head>

<header class="wrap top">

    sifter
  </a>
  <span class="sp"></span>
  <a class="out" href="https://github.com/Daily-AC/sifter" rel="noopener">GitHub</a>
</header>

<section class="wrap hero">
  <h1>好网站和 AI 作品，替你筛过一遍。</h1>
  <p class="lede">每条都用一句话说清是什么，<br>视频存了一份，打不开 X 也能看。</p>
</section>

<div class="bar" id="bar">
  <div class="wrap bar-in">
    <div class="cats" id="cats" role="group" aria-label="分类"></div>
    <label class="find">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6 14 14" stroke-linecap="round"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="搜索，如 Three.js、精灵表" aria-label="搜索网站和视频">
    </label>
  </div>
</div>

<main class="wrap">
  <div class="status" id="status" aria-live="polite"></div>
  <div class="wall" id="wall"></div>
  <noscript><p class="empty">这一页在浏览器里排版和检索，需要开启 JavaScript。<br>网站索引也可以在 <a href="https://github.com/Daily-AC/sifter/blob/main/index/README.md" style="color:var(--link)">GitHub</a> 上看。</p></noscript>
</main>

<section class="agent">
  <div class="wrap">
    <h2>也可以交给你的 agent。</h2>
    <p>网站这部分是一份开源索引：同一个站只收一次，每个链接都真的打开验过。agent 通过 MCP 直接检索，在 Claude Code 里一行装上：</p>
    <button class="cmd" id="copy" type="button" aria-label="复制安装命令">
      <code>claude mcp add sifter -- npx -y --package=@z10/sifter sifter-mcp</code>
      <span class="c" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5.5" y="5.5" width="8" height="8" rx="1.8"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg></span>
    </button>
    <div class="links">
      <a href="https://github.com/Daily-AC/sifter" rel="noopener">源码和用法 ↗</a>
      <a href="https://github.com/Daily-AC/sifter/issues/new?template=submit.yml" rel="noopener">推荐一个网站 ↗</a>
    </div>
  </div>
</section>

<footer><div class="wrap">
  <span id="stamp"></span>
  <span>MIT</span>
  <span>不用 cookie</span>
</div></footer>

<dialog class="player" id="player" aria-label="播放视频">
  <button class="close" id="close" type="button" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"/></svg></button>
  <video id="pv" controls playsinline preload="auto"></video>
  <div class="pcap"><p class="pt" id="pt"></p><p class="pm" id="pm"></p></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
