<style>
/* Tokens and chrome are the index page's, copied rather than shared: the site
   has no CSS build step, and one duplicated block is cheaper than adding one. */
:root{
  --canvas:#07080a; --surface:#0d0d0d; --elevated:#101111; --card:#121212;
  --ink:#f4f4f6; --body:#cdcdcd; --mute:#9c9c9d; --ash:#6a6b6c; --stone:#434345;
  --hairline:#242728; --hairline-strong:rgba(255,255,255,.16);
  --stripe-a:#ff5757; --stripe-b:#a1131a;
  --r:8px; --r-lg:10px;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --wrap:1080px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--canvas); color:var(--body); font-family:var(--font); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--hairline-strong); outline-offset:2px; border-radius:6px}
.wrap{max-width:var(--wrap); margin:0 auto; padding:0 24px}
@media(max-width:480px){.wrap{padding:0 16px}}
.stripe{height:3px; background:linear-gradient(90deg,var(--stripe-b),var(--stripe-a) 42%,var(--stripe-a) 58%,var(--stripe-b))}

.nav{position:sticky; top:0; z-index:50; background:rgba(7,8,10,.82); backdrop-filter:blur(12px); border-bottom:1px solid var(--hairline)}
.nav-in{display:flex; align-items:center; gap:24px; height:56px}
.mark{display:flex; align-items:center; gap:10px; font-weight:600; color:var(--ink); text-decoration:none; letter-spacing:-.01em}
.nav-sp{flex:1}
.lnk{color:var(--mute); text-decoration:none; font-size:14px; display:inline-flex; align-items:center; min-height:36px; transition:color .15s}
.lnk:hover,.lnk[aria-current]{color:var(--ink)}

.head{padding:44px 0 24px}
h1{margin:0 0 12px; color:var(--ink); font-weight:600; letter-spacing:-.022em; font-size:clamp(28px,4vw,42px); line-height:1.15}
h1 .dim{color:var(--ash)}
.lede{margin:0; max-width:58ch; color:var(--body); font-size:clamp(15px,1.5vw,16.5px); line-height:1.6}

.bar{position:sticky; top:56px; z-index:40; background:var(--canvas); padding:12px 0; border-bottom:1px solid var(--hairline)}
.bar-in{display:flex; align-items:center; gap:12px}
.search{display:flex; align-items:center; gap:10px; flex:0 1 280px; height:34px; padding:0 12px; background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r)}
.search svg{flex-shrink:0; color:var(--ash)}
.search input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; font-size:14px; outline:none}
.search input::placeholder{color:var(--stone)}
.filters{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0; -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent); padding-right:24px}
.filters::-webkit-scrollbar{display:none}
.chip{position:relative; flex-shrink:0; height:28px; padding:0 11px; border-radius:999px; font:inherit; font-size:13px; cursor:pointer; background:transparent; color:var(--mute); border:1px solid var(--hairline); white-space:nowrap; transition:color .15s,border-color .15s,background .15s}
.chip::after{content:''; position:absolute; inset:-6px -2px}
.chip:hover{color:var(--ink); border-color:var(--hairline-strong)}
.chip[aria-pressed="true"]{background:var(--elevated); color:var(--ink); border-color:var(--hairline-strong)}
.chip .n{color:var(--stone); margin-left:5px}
.sort{flex-shrink:0; background:transparent; border:0; color:var(--mute); font:inherit; font-size:13px; cursor:pointer; padding:6px 2px}
.sort:hover{color:var(--ink)}
@media(max-width:720px){
  .bar-in{flex-wrap:wrap}
  .search{flex:1 1 100%; order:-1}
}

.meta{padding:14px 0 0; font-size:12.5px; color:var(--ash)}
.grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); padding:14px 0 72px}
.grid > *{min-width:0}
.card{display:flex; flex-direction:column; background:var(--card); border:1px solid var(--hairline); border-radius:var(--r-lg); overflow:hidden; text-decoration:none; transition:border-color .15s,transform .15s}
.card:hover,.card:focus-visible{border-color:var(--hairline-strong)}
.thumb{position:relative; aspect-ratio:16/10; background:var(--surface); overflow:hidden}
.thumb img{display:block; width:100%; height:100%; object-fit:cover; transition:transform .3s}
.card:hover .thumb img{transform:scale(1.02)}
.play{position:absolute; left:10px; bottom:10px; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.55); display:grid; place-items:center; color:#fff; backdrop-filter:blur(4px)}
.multi{position:absolute; right:10px; bottom:10px; padding:2px 7px; border-radius:999px; background:rgba(0,0,0,.55); color:#fff; font-size:11.5px}
.body{padding:12px 14px 14px; display:flex; flex-direction:column; gap:10px; flex:1}
.zh{margin:0; color:var(--ink); font-size:14.5px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.tail{margin-top:auto; display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-size:12px; color:var(--ash)}
.likes{display:inline-flex; align-items:center; gap:4px}
.who{max-width:12em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sep{color:var(--stone)}
.tag{padding:0 7px; border:1px solid var(--hairline); border-radius:999px; color:var(--mute); font-size:11.5px; line-height:18px}
.empty{grid-column:1/-1; padding:56px 0; text-align:center; color:var(--ash); font-size:14px}

footer{padding:32px 0 40px; border-top:1px solid var(--hairline); color:var(--ash); font-size:13px}
footer a{color:var(--mute); text-decoration:none}
footer a:hover{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
