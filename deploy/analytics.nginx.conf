# /etc/nginx/conf.d/10-sifter-events.conf
# Source of truth: deploy/analytics.nginx.conf — installed by deploy/install-analytics.sh
#
# This is the entire analytics backend for sifter.z10.dev. There is no process,
# no database and no third-party service: the page reports an event as a query
# string, nginx appends one line and answers 204. The reader is tools/stats.mjs.

# The one field in an ordinary access log that identifies a person is the
# User-Agent, so it is never written — it is collapsed to a class on the way
# in. That is all the store needs, and it is what everything downstream wants
# anyway: a crawler's search terms are not a reader's.
map $http_user_agent $sifter_client {
    default  "browser";
    ""       "none";
    "~*(bot|crawl|spider|slurp|headless|preview|monitor|curl|wget|python-|okhttp|go-http|java/|axios|node-fetch)"  "bot";
}

# Rate limiting needs a per-reader key, and every request reaches ls from hk's
# single address, so the key has to come out of the forwarded header.
#
# Note what this is and is not: the address lives in shared memory for the
# length of the rate window and is never written to disk. The log format below
# has no address field at all — not an anonymised one, none — which is why hk
# is configured not to log this endpoint either. Splitting "who asked" from
# "what they searched for" across two machines only works if neither one holds
# both halves.
map $http_x_forwarded_for $sifter_reporter {
    default          $remote_addr;
    "~^\s*([^,\s]+)" $1;
}

limit_req_zone $sifter_reporter zone=sifter_events:1m rate=60r/m;

# One JSON object per event. $args is carried through verbatim rather than
# broken into named fields: adding an event type should be a change in
# analytics.mjs and stats.mjs, not a change that needs root on the server.
log_format sifter_event escape=json
    '{"at":"$time_iso8601","c":"$sifter_client","a":"$args"}';
