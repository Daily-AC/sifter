# /etc/nginx/snippets/sifter-events.conf — included by the sifter server block on ls.
# Source of truth: deploy/analytics.location.conf
#
# Reports arrive as a query string on an empty POST — navigator.sendBeacon with
# no body — so nginx records one without ever reading a request body.
location = /e {
    limit_req zone=sifter_events burst=30 nodelay;
    limit_req_status 429;

    # Its own file, outside /var/log/nginx, on purpose: the packaged nginx
    # logrotate rule globs /var/log/nginx/*.log and keeps 14 days, and a second
    # rule over the same path is a logrotate error, not an override.
    access_log /var/log/sifter/events.log sifter_event;

    add_header Cache-Control "no-store" always;
    return 204;
}
