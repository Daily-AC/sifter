# /etc/nginx/snippets/sifter-events-hk.conf — included by the sifter server block on hk.
# Source of truth: deploy/analytics.hk.conf
#
# hk terminates the reader's connection and therefore knows their address; ls
# does not, and the store on ls has no address field. Logging /e here would put
# both halves — who asked, and what they searched for — in one file on one
# machine, which is the single thing this design exists to avoid. So this hop
# forwards and stays quiet.
location = /e {
    access_log off;

    proxy_pass https://49.232.31.177:8443;
    proxy_ssl_server_name on;
    proxy_ssl_name sifter.z10.dev;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}
