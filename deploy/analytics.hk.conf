# /etc/nginx/snippets/sifter-events-hk.conf — included by the sifter server block on hk.
# Source of truth: deploy/analytics.hk.conf
#
# hk terminates the reader's connection and therefore knows their address; ls
# does not, and the store on ls has no address field. The only text that ever
# reaches the store is a term somebody chose to send; logging /e here would
# attach an address to that choice, on one machine, in one file. So this hop
# forwards and stays quiet.
#
# The origin below is filled in at install time from the proxy_pass already in
# the site's vhost on that machine — this snippet has to reach the same origin
# as the rest of the site, and reading it beats keeping a second copy in sync
# here (or publishing someone's internal topology in a public repository).
location = /e {
    access_log off;

    proxy_pass https://__ORIGIN__;
    proxy_ssl_server_name on;
    proxy_ssl_name sifter.z10.dev;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}
